- number: 1
  title: "Parametric shape optimization of flagellated microswimmers using Bayesian techniques"
  authors: "L. Palazzolo, M. Binois, L. Berti, L. Giraldi"
  description: "Understanding and optimizing the design of helical microswimmers is crucial for advancing their application in various fields. This study presents an innovative approach combining Free-Form Deformation with Bayesian Optimization to enhance the shape of these swimmers. Our method facilitates the computation of generic swimmer shapes that achieve optimal average speed and efficiency. Applied to both monoflagellated and biflagellated swimmers, our optimization framework has led to the identification of new optimal shapes. These shapes are compared with biological counterparts, highlighting a diverse range of swimmers, including both pushers and pullers."
