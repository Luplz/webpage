- number: 2
  title: "Non-Locally Controllable but Trackable Magnetic Head Flagellated Swimmer"
  authors: "L. Palazzolo, M. Binois, L. Giraldi"
  description: "Unlike macroscopic swimmers, microswimmers operate in a low-Reynolds-number regime dominated by viscous forces. This paper investigates the controllability of a magnetic microswimmer composed of a spherical magnetic head and an elastic, non-magnetic flagellum. The swimmer evolves in a Stokes flow and is modeled using the resistive force theory. We prove that, under planar motion, the system is not small-time locally controllable and numerically identify regions that remain inaccessible. Nevertheless, simulations show that trajectory tracking can still be achieved via Bayesian optimization, though it requires large-amplitude transverse deformations."
