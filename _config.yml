# Site settings
title: Lucas Palazzolo webpage
email: your-email@domain.com
description: Personal website of Lucas Palazzolo. Research, projects, publications, and contact information.

baseurl: "/webpage"       
url: "https://Luplz.github.io" 

include:
  - .htaccess
  - _pages

sass:
  sass_dir: _sass


markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins:
  - jekyll-sitemap
